[package]
name = "kvmctl"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
bytes = "1.12.0"
log = "=0.4.35"
rtc = "=0.21.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "=0.22.1"
sha1 = "=0.10.7"
x509-parser = { version = "=0.18.1", features = ["verify"] }
webrtc = "=0.21.1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_Dns",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
