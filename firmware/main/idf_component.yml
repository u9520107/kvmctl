dependencies:
  idf: "==6.1.1"
  espressif/esp_peer:
    version: "==1.5.5"
    override_path: "${KVMCTL_PEER_SOURCE}"
  espressif/esp_libsrtp:
    version: "==1.0.0"
    override_path: "${KVMCTL_LIBSRTP_SOURCE}"
    # The vendored esp_peer manifest pins the registry dependency when this override is inactive.
    rules:
      - if: "$KVMCTL_USE_LOCAL_LIBSRTP == 1"
  espressif/led_strip:
    version: "3.0.3"
  espressif/mdns:
    version: "==1.14.1"
